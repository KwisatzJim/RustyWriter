[package]
name = "rustywriter-helper"
version = "0.1.0"
edition = "2021"
description = "Privileged worker for RustyWriter. Not meant to be run directly by users."

[[bin]]
name = "rustywriter-helper"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

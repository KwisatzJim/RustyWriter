name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install current stable Rust and Clippy
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Check frontend JavaScript
        run: node --check ui/main.js

      - name: Prepare helper sidecar
        run: ./scripts/prepare-sidecar.sh

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run strict Clippy checks
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
